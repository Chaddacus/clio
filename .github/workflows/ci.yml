name: CI

on:
  pull_request:
    branches: [main, dev]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: voice_notes_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DEBUG: 'True'
      SECRET_KEY: 'ci-test-secret-key'
      DB_NAME: voice_notes_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: '5432'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Backend lint
        working-directory: backend
        run: |
          pip install ruff==0.1.9
          ruff check .
      - name: Backend install
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Backend typecheck
        working-directory: backend
        run: mypy apps/ --ignore-missing-imports
      - name: Backend test
        working-directory: backend
        run: |
          python manage.py migrate
          pytest --cov=apps --cov-report=term-missing --cov-fail-under=60 -q

      - name: Frontend install
        working-directory: frontend
        run: npm ci
      - name: Frontend lint
        working-directory: frontend
        run: npm run lint
      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: E2E browser install
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start services
        run: docker compose up -d
        env:
          OPENAI_API_KEY: 'test-key-not-real'
          # One runner address drives the whole suite; the production default
          # (60/minute) throttles legitimate test traffic. CI-only value.
          THROTTLE_ANON_RATE: '1000/minute'
      - name: Wait for backend health
        run: |
          timeout 90 bash -c 'until curl -sf http://localhost:8011/api/health/ > /dev/null 2>&1; do sleep 3; done'
      - name: Wait for frontend
        run: |
          timeout 90 bash -c 'until curl -sf http://localhost:3011/ > /dev/null 2>&1; do sleep 3; done'
      - name: E2E test
        working-directory: frontend
        run: npx playwright test --project=chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
