[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    live: sends real audio to the real transcription provider (needs DEEPGRAM_API_KEY); run with -m live
    ai_eval: calls the real translation provider (needs the Anthropic key in the environment); run with -m ai_eval
addopts = --tb=short -q -m "not live and not ai_eval"
